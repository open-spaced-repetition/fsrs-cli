name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checksums
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BASE_URL="https://github.com/open-spaced-repetition/fsrs-cli/releases/download/v${VERSION}"

          declare -A TARGETS=(
            ["aarch64-apple-darwin"]="SHA_MACOS_ARM"
            ["x86_64-apple-darwin"]="SHA_MACOS_INTEL"
            ["aarch64-unknown-linux-gnu"]="SHA_LINUX_ARM"
            ["x86_64-unknown-linux-gnu"]="SHA_LINUX_INTEL"
          )

          for target in "${!TARGETS[@]}"; do
            url="${BASE_URL}/fsrs-${target}.tar.gz"
            sha=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
            echo "${TARGETS[$target]}=$sha" >> "$GITHUB_ENV"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update Formula
        run: |
          cat > Formula/fsrs.rb << 'RUBY'
          class Fsrs < Formula
            desc "CLI tool for FSRS (Free Spaced Repetition Scheduler)"
            homepage "https://github.com/open-spaced-repetition/fsrs-cli"
            version "${{ env.VERSION }}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/open-spaced-repetition/fsrs-cli/releases/download/v${{ env.VERSION }}/fsrs-aarch64-apple-darwin.tar.gz"
                sha256 "${{ env.SHA_MACOS_ARM }}"
              end

              on_intel do
                url "https://github.com/open-spaced-repetition/fsrs-cli/releases/download/v${{ env.VERSION }}/fsrs-x86_64-apple-darwin.tar.gz"
                sha256 "${{ env.SHA_MACOS_INTEL }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/open-spaced-repetition/fsrs-cli/releases/download/v${{ env.VERSION }}/fsrs-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ env.SHA_LINUX_ARM }}"
              end

              on_intel do
                url "https://github.com/open-spaced-repetition/fsrs-cli/releases/download/v${{ env.VERSION }}/fsrs-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ env.SHA_LINUX_INTEL }}"
              end
            end

            def install
              bin.install "fsrs"
            end

            test do
              assert_match "fsrs", shell_output("#{bin}/fsrs --version")
            end
          end
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fsrs.rb
          git commit -m "Update Homebrew formula to v${{ env.VERSION }}" || exit 0
          git push
