[package]
name = "fsrs-cli"
version = "0.1.0"
edition = "2024"
description = "A production-ready CLI tool for FSRS (Free Spaced Repetition Scheduler)"
license = "Apache-2.0"
repository = "https://github.com/open-spaced-repetition/fsrs-cli"
keywords = ["fsrs", "spaced-repetition", "cli", "anki", "flashcards"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "fsrs"
path = "src/main.rs"

[dependencies]
fsrs = { git = "https://github.com/open-spaced-repetition/fsrs-rs" }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
csv = "1.4.0"
chrono = "0.4.44"
anyhow = "1.0"
indicatif = "0.18.4"
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tokio-stream = "0.1"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tempfile = "3"
rustyline = "18"
shellwords = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
